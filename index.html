<!DOCTYPE html>
<html>
<head>
    <title>Bafang E-Bike Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        button { padding: 15px; font-size: 16px; margin: 5px 0; width: 100%; cursor: pointer; }
        .data-box { background: #e0f7fa; padding: 15px; border-radius: 8px; margin: 15px 0; }
        pre { background: #f4f4f4; padding: 10px; font-size: 12px; overflow-x: auto; }
    </style>
</head>
<body>
    <h2>Bafang Ride Logger</h2>
    
    <button id="connectBtn">Connect to Bike & Start Logging</button>
    <button id="exportBtn" disabled>Export CSV</button>
    
    <div class="data-box">
        <h4 style="margin-top:0;">Live Status</h4>
        <div id="status">Status: Disconnected</div>
        <div id="gpsDisplay">GPS: Waiting...</div>
		<div id="pasDisplay">PAS Level: --</div>
    </div>
    
    <hr>
    <h3>Live Hex Stream (Last 5)</h3>
    <pre id="consoleOutput">Waiting for Bluetooth data...</pre>

    <script>
        let rideData = [];
        let currentLat = 0, currentLon = 0;
        let recentHexLogs = [];
        let wakeLock = null;

        // 1. Keep the screen awake
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.error(`Wake Lock error: ${err.name}, ${err.message}`);
                }
            }
        }

        // 2. Start GPS Tracking
        navigator.geolocation.watchPosition(
            (position) => {
                currentLat = position.coords.latitude;
                currentLon = position.coords.longitude;
                document.getElementById('gpsDisplay').innerText = 
                    `GPS: ${currentLat.toFixed(5)}, ${currentLon.toFixed(5)}`;
            },
            (err) => console.error("GPS Error:", err),
            { enableHighAccuracy: true }
        );

        // 3. Connect to Bike
        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'DP E12.CAN' }],
                    optionalServices: ['0000fff0-0000-1000-8000-00805f9b34fb']
                });
                
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
                const notifyChar = await service.getCharacteristic('0000fff4-0000-1000-8000-00805f9b34fb');
                
                await notifyChar.startNotifications();
                notifyChar.addEventListener('characteristicvaluechanged', handleBikeData);
                
                document.getElementById('status').innerText = "Status: Connected & Logging";
                document.getElementById('exportBtn').disabled = false;
                
                await requestWakeLock();
                
            } catch (error) {
                console.error("Bluetooth Error:", error);
                document.getElementById('status').innerText = "Status: Connection Failed";
            }
        });

        // 4. Handle incoming Bike Data
function handleBikeData(event) {
    const buffer = new Uint8Array(event.target.value.buffer);
    
    // Create the raw hex string for debugging/logging
    const hexString = Array.from(buffer)
        .map(b => b.toString(16).padStart(2, '0').toUpperCase())
        .join(' ');

    console.log("Raw Bike Data:", hexString);

    // Parse the specific Commands
    const cmdId = buffer[2]; // The 3rd byte is the Command ID
    let currentPas = "Unknown";

    // If the Command ID is 74 (0x4A in hex), parse the PAS level
    if (cmdId === 74) {
        currentPas = buffer[4]; // The 5th byte contains the PAS level
        
        // Update the UI (You'll need to add <div id="pasDisplay"> to your HTML)
        const pasDiv = document.getElementById('pasDisplay');
        if (pasDiv) pasDiv.innerText = `PAS Level: ${currentPas}`;
    }

    // Update the on-screen hex log
    recentHexLogs.unshift(hexString);
    if (recentHexLogs.length > 5) recentHexLogs.pop();
    document.getElementById('consoleOutput').innerText = recentHexLogs.join('\n');

    // Save to the CSV array
    rideData.push({
        timestamp: new Date().toISOString(),
        lat: currentLat,
        lon: currentLon,
        pas: currentPas,
        rawHex: hexString
    });
}

        // 5. Export Data to CSV
        document.getElementById('exportBtn').addEventListener('click', () => {
            let csvContent = "data:text/csv;charset=utf-8,Timestamp,Lat,Lon,RawHex\n";
            rideData.forEach(row => {
                csvContent += `${row.timestamp},${row.lat},${row.lon},${row.rawHex}\n`;
            });
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "bafang_ride_log.csv");
            document.body.appendChild(link);
            link.click();
        });
    </script>
</body>
</html>
