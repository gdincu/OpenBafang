<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenBafang</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
	<link rel="icon" type="image/png" href="icon.png">
    <meta name="theme-color" content="#007bff">
</head>
<body>

    <h2>OpenBafang</h2>
    
    <!-- Collapsible Configuration Panel -->
    <details class="card" id="configCard">
        <summary><b>Configure Log & Display Metrics</b></summary>
        <div class="config-grid" style="margin-top: 12px;">
            <label><input type="checkbox" id="chk_timestamp" checked disabled> Timestamp</label>
            <label><input type="checkbox" id="chk_latlon" checked disabled> Lat / Lon / Alt</label>
            <label><input type="checkbox" id="chk_speed" checked> Speed</label>
            <label><input type="checkbox" id="chk_battery" checked> Battery %</label>
            <label><input type="checkbox" id="chk_odo"> Odometer</label>
            <label><input type="checkbox" id="chk_temp"> Battery Temp</label>
            <label><input type="checkbox" id="chk_pas"> PAS Level</label>
            <label><input type="checkbox" id="chk_voltage"> Voltage</label>
            <label><input type="checkbox" id="chk_range"> Est. Range</label>
            <label><input type="checkbox" id="chk_trip"> Trip Dist.</label>
            <label><input type="checkbox" id="chk_torque"> Torque</label>
            <label><input type="checkbox" id="chk_light"> Headlight</label>
        </div>
    </details>

    <div class="btn-group">
        <button id="connectBtn">Connect to Bike</button>
        <button id="disconnectBtn" style="display:none;">Disconnect</button>
    </div>
    
    <button id="exportBtn" disabled>Export CSV Log</button>
    
    <div class="card">
        <div class="status-row">
            <div id="status">Status: <span class="status-badge status-disconnected">Disconnected</span></div>
            <div id="gpsDisplay">GPS: <span class="status-badge status-searching">Searching</span></div>
        </div>

        <!-- Large Primary Display for Speed & Battery -->
        <div class="primary-metrics">
            <div class="metric-primary" id="box_speed">
                <div class="metric-title">Speed</div>
                <div class="metric-value-large" id="speedDisplay">-- km/h</div>
            </div>
            <div class="metric-primary" id="box_battery">
                <div class="metric-title">Battery</div>
                <div class="metric-value-large" id="battDisplay">-- %</div>
            </div>
        </div>

        <!-- Smaller Grid for Optional Secondary Metrics -->
        <div class="metric-grid" id="secondaryGrid">
            <div class="metric" id="box_pas" style="display:none;">
                <div class="metric-title">PAS Level</div>
                <div class="metric-value" id="pasDisplay">--</div>
            </div>
            <div class="metric" id="box_voltage" style="display:none;">
                <div class="metric-title">Voltage</div>
                <div class="metric-value" id="voltDisplay">-- V</div>
            </div>
            <div class="metric" id="box_range" style="display:none;">
                <div class="metric-title">Est. Range</div>
                <div class="metric-value" id="rangeDisplay">-- km</div>
            </div>
            <div class="metric" id="box_trip" style="display:none;">
                <div class="metric-title">Trip Dist.</div>
                <div class="metric-value" id="tripDisplay">-- km</div>
            </div>
            <div class="metric" id="box_odo" style="display:none;">
                <div class="metric-title">Odometer</div>
                <div class="metric-value" id="odoDisplay">-- km</div>
            </div>
            <div class="metric" id="box_torque" style="display:none;">
                <div class="metric-title">Torque</div>
                <div class="metric-value" id="torqueDisplay">--</div>
            </div>
            <div class="metric" id="box_temp" style="display:none;">
                <div class="metric-title">Batt. Temp</div>
                <div class="metric-value" id="tempDisplay">-- °C</div>
            </div>
            <div class="metric" id="box_light" style="display:none;">
                <div class="metric-title">Headlight</div>
                <div class="metric-value" id="lightDisplay">--</div>
            </div>
        </div>
		
		<div class="control-panel" id="controlPanel" style="display:none; margin-top: 15px; border-top: 1px solid #eee; padding-top: 12px;">
        <div class="metric-title" style="margin-bottom: 8px;">Remote Controls</div>
        <div style="display: flex; gap: 10px; margin-bottom: 8px;">
            <button id="toggleLightBtn" class="control-btn" style="background: #6c757d; color: white;">Toggle Light</button>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; background: #f8f9fa; padding: 8px 12px; border-radius: 6px;">
            <span style="font-size: 13px; font-weight: bold; color: #555;">PAS Level:</span>
            <div style="display: flex; gap: 6px;">
                <button class="pas-btn" data-level="0" style="padding: 6px 12px; font-size: 13px;">0</button>
                <button class="pas-btn" data-level="1" style="padding: 6px 12px; font-size: 13px;">1</button>
                <button class="pas-btn" data-level="2" style="padding: 6px 12px; font-size: 13px;">2</button>
                <button class="pas-btn" data-level="3" style="padding: 6px 12px; font-size: 13px;">3</button>
                <button class="pas-btn" data-level="4" style="padding: 6px 12px; font-size: 13px;">4</button>
                <button class="pas-btn" data-level="5" style="padding: 6px 12px; font-size: 13px;">5</button>
            </div>
        </div>
    </div>
    </div>
    
    <!-- Collapsible Raw Hex Stream Panel -->
    <details class="card">
        <summary style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <b>Raw Hex Stream</b>
            <label style="font-size: 13px; cursor: pointer;" onclick="event.stopPropagation()">
                <input type="checkbox" id="toggleHex"> Enable Logging
            </label>
        </summary>
        <pre id="consoleOutput" style="margin-top: 12px;">Logging is disabled.</pre>
    </details>

    <script type="module" src="js/app.js"></script>
</body>
</html>
