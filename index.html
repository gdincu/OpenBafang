<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenBafang</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
</head>
<body>

    <h2>OpenBafang</h2>
    
    <!-- Collapsible Configuration Panel -->
    <details class="card" id="configCard">
        <summary><b>Configure Log Metrics</b></summary>
        <div class="config-grid" style="margin-top: 12px;">
            <label><input type="checkbox" id="chk_timestamp" checked disabled> Timestamp</label>
            <label><input type="checkbox" id="chk_latlon" checked disabled> Lat / Lon</label>
            <label><input type="checkbox" id="chk_speed" checked> Speed</label>
            <label><input type="checkbox" id="chk_odo" checked> Odometer</label>
            <label><input type="checkbox" id="chk_battery" checked> Battery %</label>
            <label><input type="checkbox" id="chk_temp" checked> Battery Temp</label>
            <label><input type="checkbox" id="chk_pas"> PAS Level</label>
            <label><input type="checkbox" id="chk_voltage"> Voltage</label>
            <label><input type="checkbox" id="chk_range"> Est. Range</label>
            <label><input type="checkbox" id="chk_trip"> Trip Dist.</label>
            <label><input type="checkbox" id="chk_torque"> Torque</label>
            <label><input type="checkbox" id="chk_light"> Headlight</label>
        </div>
    </details>

    <div class="btn-group">
        <button id="connectBtn">Connect to Bike</button>
        <button id="disconnectBtn" style="display:none;">Disconnect</button>
    </div>
    
    <button id="exportBtn" disabled>Export CSV Log</button>
    
    <div class="card">
        <h4 style="margin: 0 0 10px 0;">Live System State</h4>
        <div id="status">Status: <b>Disconnected</b></div>
        <div id="gpsDisplay">GPS: Waiting...</div>

        <div class="metric-grid">
            <div class="metric">
                <div class="metric-title">Speed</div>
                <div class="metric-value" id="speedDisplay">-- km/h</div>
            </div>
            <div class="metric">
                <div class="metric-title">PAS Level</div>
                <div class="metric-value" id="pasDisplay">--</div>
            </div>
            <div class="metric">
                <div class="metric-title">Battery</div>
                <div class="metric-value" id="battDisplay">-- %</div>
            </div>
            <div class="metric">
                <div class="metric-title">Voltage</div>
                <div class="metric-value" id="voltDisplay">-- V</div>
            </div>
            <div class="metric">
                <div class="metric-title">Est. Range</div>
                <div class="metric-value" id="rangeDisplay">-- km</div>
            </div>
            <div class="metric">
                <div class="metric-title">Trip Dist.</div>
                <div class="metric-value" id="tripDisplay">-- km</div>
            </div>
            <div class="metric">
                <div class="metric-title">Odometer</div>
                <div class="metric-value" id="odoDisplay">-- km</div>
            </div>
            <div class="metric">
                <div class="metric-title">Torque</div>
                <div class="metric-value" id="torqueDisplay">--</div>
            </div>
            <div class="metric">
                <div class="metric-title">Batt. Temp</div>
                <div class="metric-value" id="tempDisplay">-- °C</div>
            </div>
            <div class="metric">
                <div class="metric-title">Headlight</div>
                <div class="metric-value" id="lightDisplay">--</div>
            </div>
        </div>
    </div>
    
    <!-- Collapsible Raw Hex Stream Panel -->
    <details class="card">
        <summary style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <b>Raw Hex Stream</b>
            <label style="font-size: 13px; cursor: pointer;" onclick="event.stopPropagation()">
                <input type="checkbox" id="toggleHex"> Enable Logging
            </label>
        </summary>
        <pre id="consoleOutput" style="margin-top: 12px;">Logging is disabled.</pre>
    </details>

    <script src="app.js"></script>
</body>
</html>
